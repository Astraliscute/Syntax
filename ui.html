<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="syntax.ico">
  <title>Syntax v2.0</title>
  <style>
    :root {
      --bg: #16151a;
      --panel: #1c1b21;
      --raised: #28252f;
      --field: #17161c;
      --line: #35313d;
      --text: #e6e3eb;
      --muted: #aaa3b4;
      --dim: #91899c;
      --accent: #b09bc9;
      --accent-light: #d3c4e4;
      --red: #d78d9c;
      --amber: #cbb181;
      --good: #a1bba4;
      --mono: Consolas, "Cascadia Code", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--text);
      background: var(--bg);
      font: 12px/1.45 "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; }
    button:disabled { cursor: default; opacity: .45; }
    button, input, select, textarea { outline: none; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent) !important; }
    input::placeholder, textarea::placeholder { color: var(--dim); }
    svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    svg.discord-icon { fill: currentColor; stroke: none; }
    svg.console-icon { fill: currentColor; stroke: none; }
    svg.console-icon .console-mark { fill: none; stroke: var(--bg); stroke-width: 1.9; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 20px; font-weight: 600; letter-spacing: -.3px; }
    h2 { font-size: 12px; font-weight: 600; }
    h3 { font-size: 12px; font-weight: 600; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); }
    .hidden, [hidden] { display: none !important; }
    #snow { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .6; }
    #desktop { position: relative; z-index: 2; height: calc(100% - 29px); }
    .titlebar { height: 40px; padding: 0 10px 0 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: var(--bg); user-select: none; }
    .titlebrand { display: flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 550; }
    .titlelogo { width: 21px; height: 21px; object-fit: contain; }
    .version { color: var(--dim); font-size: 10px; margin-left: 3px; }
    .window-actions { display: flex; gap: 4px; }
    .iconbutton { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: transparent; border-radius: 3px; color: var(--muted); }
    .iconbutton:hover { color: var(--text); background: var(--raised); }
    .iconbutton.danger:hover { color: var(--red); background: #f5a3bc12; }
    .iconbutton svg { width: 14px; height: 14px; }
    .shell { display: flex; height: calc(100% - 40px); }
    .sidebar { width: 178px; flex-shrink: 0; padding: 18px 10px 12px; display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 9px; padding: 0 9px 21px; }
    .brand img { width: 27px; height: 27px; object-fit: contain; }
    .brand strong { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .navbtn { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 1px solid transparent; border-radius: 3px; color: var(--muted); background: transparent; text-align: left; font-size: 11px; }
    .navbtn:hover { background: #ffffff05; color: var(--text); }
    .navbtn.active { color: var(--text); background: var(--raised); box-shadow: inset 2px 0 var(--accent); }
    .navbtn svg { width: 16px; height: 16px; }
    .navcount { margin-left: auto; color: var(--muted); font: 10px var(--mono); }
    .sidebottom { margin-top: auto; }
    .side-divider { height: 1px; background: var(--line); margin: 22px 10px 17px; }
    .connection { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); margin: 18px 10px 0; padding-top: 17px; color: var(--muted); font-size: 10px; }
    .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .dot.good { background: var(--good); }
    .dot.warn { background: var(--amber); }
    .dot.bad { background: var(--red); }
    .workspace { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .content { min-height: 0; flex: 1; overflow: auto; padding: 21px 22px; scrollbar-gutter: stable; }
    .page { max-width: 1440px; margin: 0 auto; animation: enter .12s ease; }
    .pagehead { display: flex; align-items: center; justify-content: space-between; gap: 15px; min-height: 33px; margin-bottom: 17px; }
    .pagetitle { display: flex; align-items: center; gap: 10px; }
    .count { padding: 1px 3px; font: 10px var(--mono); color: var(--dim); }
    .actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .btn { min-height: 30px; padding: 5px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--raised); font-size: 11px; font-weight: 400; white-space: nowrap; }
    .btn:hover { background: var(--raised); border-color: var(--dim); }
    .btn svg { width: 13px; height: 13px; }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
    .btn.primary:hover { background: var(--accent-light); border-color: var(--accent-light); }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.danger { background: #f5a3bc0a; color: var(--red); border-color: #f5a3bc25; }
    .btn.small { min-height: 25px; padding: 3px 7px; font-size: 10px; }
    .manager-grid { display: grid; grid-template-columns: minmax(0, 1fr) 285px; align-items: start; gap: 16px; }
    .manager-main { min-width: 0; }
    .quickbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
    .quickbar label { color: var(--muted); font-size: 10px; display: flex; align-items: center; gap: 9px; }
    .quickbar .btn { min-height: 27px; font-size: 10px; padding: 4px 7px; }
    .select { background: var(--field); border: 1px solid var(--line); border-radius: 3px; padding: 5px 6px; min-height: 27px; font-size: 11px; }
    .tablepanel, .catalog, .card { border: 1px solid var(--line); border-radius: 4px; background: var(--panel); overflow: hidden; }
    .tabletoolbar { display: flex; align-items: center; justify-content: space-between; gap: 9px; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .tabletitle { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 550; }
    .search { display: flex; align-items: center; gap: 7px; padding: 6px 8px; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 3px; color: var(--dim); }
    .search svg { width: 12px; height: 12px; }
    .search input { width: 100%; min-width: 0; background: transparent; border: 0; font-size: 11px; }
    .tabletoolbar .search { width: 180px; }
    .tablefilters { display: flex; align-items: center; gap: 4px; padding: 8px 11px; border-bottom: 1px solid var(--line); }
    .filter { background: transparent; color: var(--muted); font-size: 10px; padding: 4px 7px; border-radius: 3px; }
    .filter.active { background: var(--raised); color: var(--text); }
    .tablewrap { overflow: auto; max-height: calc(100vh - 350px); min-height: 280px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; text-align: left; }
    th { font-size: 10px; font-weight: 400; color: var(--muted); padding: 9px; position: sticky; top: 0; z-index: 1; background: var(--panel); border-bottom: 1px solid var(--line); }
    td { padding: 9px; font-size: 11px; vertical-align: middle; border-top: 1px solid #ffffff06; }
    tr:hover td { background: #ffffff03; }
    th:first-child, td:first-child { width: 37px; padding-left: 12px; }
    th:nth-child(3) { width: 74px; }
    th:nth-child(4) { width: 95px; }
    th:nth-child(5) { width: 28px; }
    th:last-child { width: 30px; }
    td:last-child { padding: 3px 2px; }
    .flagname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px var(--mono); }
    .flagprefix { color: var(--dim); }
    .flagsuffix { color: var(--text); }
    .typeinput { width: 100%; padding: 4px 1px; border: 0; background: transparent; color: var(--muted); font: 10px var(--mono); }
    .typeinput.needs-type { color: var(--amber); }
    .valueinput { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--field); font: 11px var(--mono); padding: 5px 6px; }
    .valueinput:disabled { opacity: .4; }
    .valueinput.dirty { border-color: var(--amber); }
    .rowstatus { display: flex; align-items: center; justify-content: center; }
    .toggle { position: relative; padding: 0; width: 25px; height: 15px; border: 1px solid var(--dim); border-radius: 15px; background: var(--field); flex-shrink: 0; vertical-align: middle; }
    .toggle:after { position: absolute; content: ""; top: 2px; left: 2px; width: 9px; height: 9px; background: var(--dim); border-radius: 50%; transition: transform .12s, background .12s; }
    .toggle[aria-checked=true] { border-color: var(--accent); background: var(--raised); }
    .toggle[aria-checked=true]:after { transform: translateX(10px); background: var(--accent-light); }
    .toggle.large { width: 30px; height: 18px; }
    .toggle.large:after { width: 10px; height: 10px; top: 3px; left: 3px; }
    .toggle.large[aria-checked=true]:after { transform: translateX(12px); }
    .tablefooter { display: flex; align-items: center; justify-content: space-between; padding: 9px 13px; border-top: 1px solid var(--line); font-size: 9px; color: var(--dim); }
    .tablefooter span:last-child { display: flex; align-items: center; gap: 4px; }
    .tablefooter svg { width: 11px; height: 11px; }
    .empty { padding: 42px 15px; text-align: center; color: var(--muted); }
    .emptyicon { width: 28px; height: 28px; display: grid; place-items: center; margin: 0 auto 9px; color: var(--dim); }
    .empty h3 { font-size: 11px; margin-bottom: 15px; }
    .empty .actions { justify-content: center; }
    .loadmore { display: block; margin: 13px auto; }
    .catalog { position: sticky; top: 0; }
    .catalog-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 7px; }
    .catalog-head h2 { font-size: 11px; }
    .catalog-tools { padding: 0 14px 12px; }
    .catalog-caption { display: flex; align-items: center; justify-content: space-between; margin: 9px 0 0; font-size: 9px; color: var(--dim); }
    .sourcebutton { border: 0; background: transparent; color: var(--accent); font-size: 10px; padding: 0; }
    .catalog-scroll { height: calc(100vh - 272px); min-height: 310px; max-height: 760px; overflow: auto; border-top: 1px solid var(--line); }
    .catalog-row { display: flex; align-items: center; gap: 9px; height: 48px; padding: 9px 11px; border-bottom: 1px solid #a47bd30d; }
    .catalog-row:hover { background: #bc8af308; }
    .catalog-add { width: 26px; height: 25px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--accent); font: 13px var(--mono); }
    .catalog-add:hover { background: var(--raised); border-color: var(--dim); }
    .catalog-add:disabled { color: var(--muted); opacity: .6; }
    .catalog-add svg { width: 12px; height: 12px; }
    .catalog-name { min-width: 0; flex: 1; }
    .catalog-name strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 10px var(--mono); color: var(--text); }
    .catalog-name small { display: block; color: var(--dim); font-size: 9px; margin-top: 3px; }
    .presetgrid { display: grid; grid-template-columns: minmax(0, 1fr); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
    .presetcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(165px, 230px) 100px; align-items: center; gap: 20px; padding: 15px 17px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
    .presetcard:last-child { border-bottom: 0; }
    .presetcard.selected { box-shadow: inset 2px 0 var(--accent); }
    .preset-summary { min-width: 0; }
    .presethead { display: flex; align-items: center; gap: 10px; margin-bottom: 3px; }
    .pill { color: var(--dim); font-size: 10px; white-space: nowrap; }
    .pill.selected { color: var(--good); }
    .presetcount { color: var(--dim); font-size: 10px; margin: 4px 0 9px; }
    .presetcontrols { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .controlrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .controlrow span { min-width: 0; overflow-wrap: anywhere; }
    .controlrow .select { min-width: 70px; max-width: 130px; }
    .controlrow input { max-width: 85px; }
    .preset-actions { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
    .preset-actions .btn { width: 100%; }
    .community-card .preset-summary { grid-column: 1 / 3; }
    .preset-preview { display: flex; flex-direction: column; gap: 3px; min-height: 16px; }
    .preset-preview small { color: var(--dim); font-size: 9px; }
    .preset-fflag { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font: 10px var(--mono); padding: 2px 0; }
    .glow-orange { --warning: #ffb265; --warning-bg: #ff9f3519; }
    .glow-red { --warning: #ff758e; --warning-bg: #ff476519; }
    tr.glow-orange td, tr.glow-red td { background: var(--warning-bg); }
    tr.glow-orange td:first-child, tr.glow-red td:first-child { box-shadow: inset 2px 0 var(--warning); }
    .glow-orange .flagname, .glow-red .flagname, .preset-fflag.glow-orange, .preset-fflag.glow-red { color: var(--warning); }
    .glow-orange .flagprefix, .glow-orange .flagsuffix, .glow-red .flagprefix, .glow-red .flagsuffix { color: inherit; }
    .preset-fflag.glow-orange, .preset-fflag.glow-red { background: var(--warning-bg); border-left: 2px solid var(--warning); padding-left: 5px; }
    .draft-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .draft-add, .draft-row { display: grid; grid-template-columns: minmax(0, 1fr) 115px 55px; gap: 7px; align-items: center; }
    .draft-add { margin-bottom: 12px; }
    .draft-row { padding: 7px; border-bottom: 1px solid var(--line); }
    .draft-row .input { font-size: 10px; padding: 7px; }
    .draft-row .iconbutton { justify-self: center; }
    .draft-row.glow-orange, .draft-row.glow-red { background: var(--warning-bg); border-left: 2px solid var(--warning); }
    .draft-row.glow-orange .input:first-child, .draft-row.glow-red .input:first-child { color: var(--warning); box-shadow: 0 0 9px var(--warning-bg); }
    .draft-list { max-height: 265px; overflow: auto; border: 1px solid var(--line); border-radius: 3px; min-height: 100px; }
    .draft-count { margin-top: 8px; font-size: 9px; color: var(--dim); }
    .preset-modal .modalbody { max-height: calc(100vh - 170px); overflow: auto; }
    .settingsgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 850px; }
    .cardhead { display: flex; align-items: center; gap: 8px; padding: 15px 18px; border-bottom: 1px solid var(--line); color: var(--muted); }
    .cardhead svg { width: 15px; height: 15px; }
    .cardhead h2 { color: var(--text); font-size: 11px; }
    .cardbody { padding: 19px; }
    .settingrow { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 19px; font-size: 11px; }
    .settingrow:last-child { margin-bottom: 0; }
    .hr { height: 1px; margin: 18px 0; background: var(--line); }
    .update-label { color: var(--dim); font-size: 10px; margin: 15px 0 0; overflow-wrap: anywhere; }
    .credits-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; max-width: 850px; }
    .credit { display: flex; align-items: center; gap: 13px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .credit:last-child { border: 0; }
    .credit strong { display: block; font-size: 11px; }
    .credit small { display: block; color: var(--muted); font-size: 10px; margin-top: 4px; }
    .about { display: flex; flex-direction: column; align-items: flex-start; padding: 23px; text-align: left; }
    .about img { width: 38px; height: 38px; margin-bottom: 12px; object-fit: contain; }
    .about h2 { font-size: 19px; letter-spacing: -.3px; }
    .about .version { margin: 4px 0 19px; }
    .logview { min-height: 330px; max-height: calc(100vh - 235px); overflow: auto; background: var(--field); padding: 14px 16px; font: 11px/1.85 var(--mono); }
    .logline { display: flex; gap: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .logtime { color: var(--dim); flex-shrink: 0; user-select: none; }
    .logtext { color: var(--muted); }
    .logtext.good { color: var(--accent-light); }
    .logtext.bad { color: var(--red); }
    .modalback { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 30px; background: #0009; }
    .modal { width: 420px; max-width: 100%; border: 1px solid var(--dim); border-radius: 5px; background: var(--panel); box-shadow: 0 8px 30px #0006; }
    .modal.wide { width: 640px; }
    .modalhead { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .modalhead h2 { font-size: 12px; }
    .modalbody { padding: 19px; }
    .modalfoot { display: flex; justify-content: flex-end; gap: 7px; padding: 12px 18px; border-top: 1px solid var(--line); }
    .formfield { margin-bottom: 15px; }
    .formfield label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10px; }
    .input { width: 100%; padding: 8px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--field); font-size: 11px; }
    .raweditor { display: block; width: 100%; height: 320px; max-height: 50vh; padding: 12px; resize: vertical; border: 1px solid var(--line); border-radius: 3px; background: var(--field); color: var(--text); font: 11px/1.7 var(--mono); }
    .formerror { min-height: 17px; margin-top: 8px; color: var(--red); font-size: 10px; }
    .toasts { position: fixed; right: 22px; bottom: 42px; z-index: 30; display: flex; flex-direction: column; gap: 7px; pointer-events: none; }
    .toast { max-width: 330px; padding: 9px 12px; border: 1px solid var(--dim); border-radius: 3px; background: var(--raised); color: var(--text); font-size: 11px; animation: enter .12s ease; }
    .toast.error { color: var(--red); border-color: var(--red); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    body.no-motion *, body.no-motion *:before, body.no-motion *:after { animation: none !important; transition: none !important; }
    .startup-screen { height: calc(100% - 40px); display: grid; place-items: center; padding: 28px; }
    .startup-panel { width: 330px; max-width: 100%; }
    .startup-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 25px; }
    .startup-logo { width: 56px; height: 56px; object-fit: contain; }
    .startup-brand h1 { font-size: 22px; }
    .startup-brand .version { margin-left: 0; }
    .startup-message { color: var(--text); font-size: 12px; min-height: 20px; margin-bottom: 11px; }
    .startup-progress { display: block; width: 100%; height: 4px; border: 0; border-radius: 2px; overflow: hidden; background: var(--line); accent-color: var(--accent); }
    .startup-progress::-webkit-progress-bar { background: var(--line); }
    .startup-progress::-webkit-progress-value { background: var(--accent); }
    .startup-steps { list-style: none; margin: 18px 0; padding: 0; }
    .startup-steps li { display: flex; align-items: center; gap: 9px; padding: 5px 0; font-size: 11px; color: var(--dim); }
    .startup-steps li[data-status="active"] { color: var(--text); }
    .startup-steps li[data-status="done"] { color: var(--muted); }
    .startup-steps li[data-status="done"] .dot { background: var(--good); }
    .startup-steps li[data-status="active"] .dot { background: var(--accent); }
    .startup-steps li[data-status="warn"] { color: var(--amber); }
    .startup-steps li[data-status="warn"] .dot { background: var(--amber); }
    .startup-detail { min-height: 18px; margin-top: 13px; font-size: 10px; color: var(--muted); overflow-wrap: anywhere; }
    .startup-actions { justify-content: flex-end; margin-top: 16px; }
    body[data-theme="dark"] { --bg:#111113; --panel:#19191c; --raised:#29292e; --field:#131315; --accent:#bfc0c5; --accent-light:#ededf0; --muted:#b0b0b6; --dim:#8e8e98; --line:#36363d; --text:#e7e7eb; }
    body[data-theme="midnight"] { --bg:#14171c; --panel:#1a1e25; --raised:#262d38; --field:#15191f; --accent:#a3b3cb; --accent-light:#d1dce9; --muted:#a0a9b8; --dim:#7c8899; --line:#323b47; --text:#e4e9f0; }

(() => {
  'use strict';

  class Snowfall {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d', { alpha: true });
      this.enabled = true;
      this.wind = 0;
      this.targetWind = 0;
      this.particles = [];
      this.banks = new Float32Array(1);
      this.width = this.height = 1;
      this.frame = 0;
      this.lastTime = 0;
      this.drawTime = 0;
      this.lastPointer = null;
      this.tick = this.tick.bind(this);
      window.addEventListener('resize', () => this.resize(), { passive: true });
      window.addEventListener('pointermove', event => {
        const position = event.clientX / this.width * 2 - 1;
        const movement = this.lastPointer === null ? 0 : event.clientX - this.lastPointer;
        this.targetWind = Math.max(-1.7, Math.min(1.7, position * 1.1 + movement * .025));
        this.lastPointer = event.clientX;
      }, { passive: true });
      document.addEventListener('pointerleave', () => {
        this.targetWind = 0;
        this.lastPointer = null;
      });
      document.addEventListener('visibilitychange', () => {
        cancelAnimationFrame(this.frame);
        this.frame = 0;
        if (!document.hidden && this.enabled) this.start();
      });
      this.resize();
      if (this.ctx) this.start();
    }

    particle(initial = false) {
      return {
        x: Math.random() * this.width,
        y: initial ? Math.random() * this.height : -10 - Math.random() * 40,
        radius: .55 + Math.random() ** 2 * 1.9,
        speed: 26 + Math.random() * 57,
        opacity: .22 + Math.random() * .59,
        phase: Math.random() * Math.PI * 2,
        sway: 2 + Math.random() * 10,
      };
    }

    resize() {
      const oldWidth = this.width, oldHeight = this.height, oldBanks = this.banks;
      this.width = window.innerWidth;
      this.height = window.innerHeight;
      this.ratio = Math.min(window.devicePixelRatio || 1, 1.25);
      this.canvas.width = Math.round(this.width * this.ratio);
      this.canvas.height = Math.round(this.height * this.ratio);
      this.canvas.style.width = this.width + 'px';
      this.canvas.style.height = this.height + 'px';
      this.ctx?.setTransform(this.ratio, 0, 0, this.ratio, 0, 0);
      this.banks = new Float32Array(Math.ceil(this.width / 6) + 2);
      for (let i = 0; i < this.banks.length; i++) {
        this.banks[i] = oldBanks[Math.min(oldBanks.length - 1, Math.floor(i / this.banks.length * oldBanks.length))] || 0;
      }
      for (const particle of this.particles) {
        particle.x *= this.width / oldWidth;
        particle.y *= this.height / oldHeight;
      }
      const count = Math.round(Math.max(100, Math.min(220, this.width * this.height / 5200)));
      while (this.particles.length < count) this.particles.push(this.particle(true));
      this.particles.length = count;
    }

    setEnabled(enabled) {
      if (this.enabled === enabled) return;
      this.enabled = enabled;
      cancelAnimationFrame(this.frame);
      this.frame = 0;
      if (enabled && !document.hidden) this.start();
      else this.ctx?.clearRect(0, 0, this.width, this.height);
    }

    start() {
      if (this.frame || !this.ctx) return;
      this.lastTime = 0;
      this.drawTime = 0;
      this.frame = requestAnimationFrame(this.tick);
    }

    surface(index) {
      return 6 + Math.sin(index * .16) * 1.5 + Math.sin(index * .043) * 2.6 + this.banks[index];
    }

    settle(x, radius) {
      const center = Math.min(this.banks.length - 1, Math.max(0, Math.floor(x / 6)));
      for (let offset = -3; offset <= 3; offset++) {
        const index = center + offset;
        if (index >= 0 && index < this.banks.length) {
          this.banks[index] = Math.min(18, this.banks[index] + radius * .34 * (1 - Math.abs(offset) / 4));
        }
      }
    }

    tick(time) {
      if (!this.enabled || document.hidden) { this.frame = 0; return; }
      this.frame = requestAnimationFrame(this.tick);
      if (this.drawTime && time - this.drawTime < 32) return;
      const dt = this.lastTime ? Math.min((time - this.lastTime) / 1000, .06) : .025;
      this.lastTime = this.drawTime = time;
      this.wind += (this.targetWind - this.wind) * Math.min(1, dt * 4.5);
      const ctx = this.ctx;
      ctx.clearRect(0, 0, this.width, this.height);
      for (const particle of this.particles) {
        particle.phase += dt * .8;
        const vx = this.wind * (29 + particle.speed * .55) + Math.sin(particle.phase) * particle.sway;
        particle.x += vx * dt;
        particle.y += particle.speed * dt;
        if (particle.x < -15) particle.x = this.width + 10;
        if (particle.x > this.width + 15) particle.x = -10;
        const bank = Math.min(this.banks.length - 1, Math.max(0, Math.floor(particle.x / 6)));
        if (particle.y >= this.height - this.surface(bank)) {
          this.settle(particle.x, particle.radius);
          Object.assign(particle, this.particle());
        }
        ctx.fillStyle = `rgba(242,230,255,${particle.opacity})`;
        ctx.beginPath();
        ctx.ellipse(particle.x, particle.y, particle.radius * .7,
                    particle.radius * (1.35 + Math.abs(this.wind) * .45),
                    -Math.atan2(vx, particle.speed), 0, Math.PI * 2);
        ctx.fill();
      }
      const fill = ctx.createLinearGradient(0, this.height - 30, 0, this.height);
      fill.addColorStop(0, 'rgba(247,236,255,.93)');
      fill.addColorStop(.5, 'rgba(224,199,248,.85)');
      fill.addColorStop(1, 'rgba(154,107,194,.5)');
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(0, this.height);
      ctx.lineTo(0, this.height - this.surface(0));
      for (let i = 1; i < this.banks.length - 1; i++) {
        const x = i * 6, y = this.height - this.surface(i);
        const nextY = this.height - this.surface(i + 1);
        ctx.quadraticCurveTo(x, y, x + 3, (y + nextY) / 2);
        this.banks[i] *= .999985;
      }
      ctx.lineTo(this.width, this.height);
      ctx.closePath();
      ctx.fill();
    }
  }

  window.snowfall = new Snowfall(document.getElementById('snow'));
})();

function filteredRows() {
  return app.rows.filter(row => (!app.query || row.name.toLowerCase().includes(app.query.toLowerCase())) &&
    (app.filter === 'all' || app.filter === 'active' && app.status.flags[row.name] === 'applied' ||
      app.filter === 'issues' && (row.duplicate || row.missing || row.needs_type || ['missing', 'failed', 'unsupported'].includes(app.status.flags[row.name]))));
}

function warningClass(row) {
  return row.duplicate ? 'glow-red' : row.missing === true ? 'glow-orange' : '';
}

function renderRows() {
  const body = document.getElementById('flag-rows');
  if (!body) return;
  const filtered = filteredRows(), rows = filtered.slice(0, app.limit);
  body.innerHTML = rows.map(row => `<tr data-row="${esc(row.id)}" class="${warningClass(row)}">

      ${Object.entries(typeNames).filter(([type]) => type !== 'unknown').map(([type, label]) => `<option value="${type}" ${row.type === type ? 'selected' : ''}>${label}</option>`).join('')}

  updateRowStatus();
}

function updateRowStatus() {
  const nodes = document.querySelectorAll('[data-rowstatus]');
  if (!nodes.length) return;
  const rows = app.rowMap.size === app.rows.length ? app.rowMap : new Map(app.rows.map(row => [row.id, row]));
  nodes.forEach(element => {
    const row = rows.get(element.dataset.rowstatus);
    const state = row?.duplicate ? 'duplicate' : row?.missing ? 'missing' : row?.needs_type ? 'unknown' : row && !row.enabled ? 'disabled' : app.status.flags[row?.name] || 'waiting';
    const tone = state === 'applied' ? 'good' : ['missing', 'unknown'].includes(state) ? 'warn' : ['failed', 'duplicate'].includes(state) ? 'bad' : '';
      element.title = state === 'duplicate' ? 'Duplicate FFlag' : rowNames[state] || state;
    element.setAttribute('aria-label', element.title);
    if (element.dataset.state !== state) {
      element.innerHTML = `<span class="dot ${tone}"></span>`;
      element.dataset.state = state;
    }
  });
}

function updateStatus() {
  const state = app.status.state;
  const tone = ['active', 'ready'].includes(state) ? 'good' : ['partial', 'paused', 'pending'].includes(state) ? 'warn' : state === 'error' ? 'bad' : '';
  document.getElementById('side-status').textContent = stateNames[state] || 'Waiting for Roblox';
  document.getElementById('side-status').title = app.status.error || '';
  const apply = document.querySelector('[data-action="apply"]');
  if (apply) apply.disabled = ['connecting', 'applying'].includes(state);
  const LockF = document.querySelector('[data-preference="LockF"]');
  if (LockF) LockF.setAttribute('aria-checked', String(app.settings.LockF !== false));
  document.getElementById('side-dot').className = 'dot ' + tone;
  document.getElementById('nav-count').textContent = app.rows.length;
  updateRowStatus();
  updateRelease();
}

async function fetchCatalog(force = false, append = false) {
  const catalog = app.catalog, serial = ++catalog.serial;
  catalog.loading = true;
  catalog.error = '';
  const page = append ? catalog.page + 1 : 0;
  renderCatalog();
  const result = await api('get_catalog', catalog.query, page, 60, force);
  if (serial !== catalog.serial) return;
  catalog.loading = false;
  if (result.ok) {
    Object.assign(catalog, { items: append ? catalog.items.concat(result.items) : result.items,
      count: result.count, total: result.total, page: result.page, more: result.more, loaded: true, sourceRevision: result.revision });
  } else {
    catalog.error = result.error;
    if (!append) catalog.items = [];
  }
  renderCatalog();
  if (result.ok) await poll(true);
}

function renderCatalog() {
  const list = document.getElementById('catalog-rows');
  if (!list) return;
  const catalog = app.catalog, existing = app.rowSuffixes.size || !app.rows.length ? app.rowSuffixes : new Set(app.rows.map(row => row.suffix));
  document.getElementById('catalog-count').textContent = catalog.count ? `${catalog.count.toLocaleString('en-US')} FFlags` : 'FFlags';
  if (catalog.items.length) {
    const scroll = document.getElementById('catalog-scroll');
    const start = Math.max(0, Math.min(catalog.items.length - 1, Math.floor(scroll.scrollTop / 48) - 8));
    const end = Math.min(catalog.items.length, start + Math.ceil(scroll.clientHeight / 48) + 16);
    catalog.renderedStart = start;
    list.innerHTML = `<div aria-hidden="true" style="height:${start * 48}px"></div>` + catalog.items.slice(start, end).map(entry => {
      const added = existing.has(entry.clean);
      return `<div class="catalog-row"><button class="catalog-add" data-catalog-add="${esc(entry.name)}" aria-label="${added ? 'Added' : 'Add'} ${esc(entry.full_name)}" ${added ? 'disabled' : ''}>${icon(added ? 'check' : 'plus')}</button><div class="catalog-name"><strong title="${esc(entry.full_name)}">${esc(entry.full_name)}</strong><small>${added ? 'Added' : entry.type === 'unknown' ? 'Choose type' : typeNames[entry.type]}</small></div></div>`;
    }).join('') + `<div aria-hidden="true" style="height:${(catalog.items.length - end) * 48}px"></div>`;
  } else {
    const label = catalog.loading ? 'Loading FFlags' : catalog.error ? 'FFlags unavailable' : catalog.loaded ? 'No results' : 'Open desktop app';
    list.innerHTML = `<div class="empty"><div class="emptyicon">${icon('search')}</div><h3>${label}</h3>${catalog.error ? button('Retry', 'catalog-refresh', 'refresh') : ''}</div>`;
  }
  const more = document.getElementById('catalog-more');
  more.classList.toggle('hidden', !catalog.more || !!catalog.error);
  more.disabled = catalog.loading;
  more.textContent = catalog.loading ? 'Loading' : 'Load more';
}

function updateStartup() {
  if (app.ready) return;
  const startup = app.startupState;
  const screen = document.getElementById('startup-screen');
  const shell = document.getElementById('workspace-shell');
  if (startup.state === 'ready') {
    app.ready = true;
    clearTimeout(startupTimer);
    screen.hidden = true;
    shell.hidden = false;
    shell.inert = false;
    shell.removeAttribute('inert');
    shell.setAttribute('aria-hidden', 'false');
    document.getElementById('desktop').setAttribute('aria-busy', 'false');
    render();
    refreshPresets();
    if (screen.contains(document.activeElement)) document.querySelector('.navbtn.active')?.focus();
    return;
  }
  const update = app.update;
  const busy = ['downloading', 'preparing', 'restarting'].includes(update.state);
  const choice = startup.state === 'update_available';
  const retry = app.startupDelayed && startup.state === 'connecting';
  const canContinue = (choice || app.startupDelayed) && !busy && !retry;
  const message = busy ? updateNames[update.state] : choice ? updateNames[update.state] || startup.message : startup.message;
  const label = document.getElementById('startup-message');
  if (label.textContent !== message) label.textContent = message || 'Starting Syntax';
  const progress = document.getElementById('startup-progress');
  progress.max = busy && update.state === 'downloading' && update.size ? update.size : startup.total || 4;
  progress.value = busy && update.state === 'downloading' ? update.received || 0 : startup.completed || 0;
  document.querySelectorAll('[data-startup-step]').forEach(step => {
    const index = Number(step.dataset.startupStep);
    let status = index < startup.completed ? 'done' : index === startup.completed && !choice ? 'active' : 'pending';
    if (index === 2 && ['timeout', 'error', 'missing_asset', 'no_release'].includes(startup.update_state)) status = 'warn';
    step.dataset.status = status;
  });
  const details = busy && update.state === 'downloading' && update.size ? `${Math.min(100, Math.floor((update.received || 0) * 100 / update.size))}% · Syntax.exe.zip` :
    choice ? update.error || `${update.latest || ''} · Syntax.exe.zip` :
    app.startupDelayed ? 'Taking longer than expected' : '';
  const detail = document.getElementById('startup-detail');
  if (detail.textContent !== details) detail.textContent = details;
  document.getElementById('startup-actions').classList.toggle('hidden', !choice && !app.startupDelayed);
  document.getElementById('startup-update').classList.toggle('hidden', !choice || update.state !== 'available' || update.asset !== 'Syntax.exe.zip' || !update.download);
  document.getElementById('startup-check').classList.toggle('hidden', !choice || busy || update.state === 'available');
  document.getElementById('startup-check').disabled = update.state === 'checking';
  document.getElementById('startup-continue').classList.toggle('hidden', !canContinue);
  document.getElementById('startup-retry').classList.toggle('hidden', !retry);
}

function updateRelease() {
  const element = document.getElementById('release-status');
  if (!element) return;
  const update = app.update;
  const busy = ['downloading', 'preparing', 'restarting'].includes(update.state);
  const progress = update.state === 'downloading' && update.size ? ` ${Math.min(100, Math.floor((update.received || 0) * 100 / update.size))}%` : '';
  element.textContent = (update.error || updateNames[update.state] || '') + progress + (update.latest ? ` · ${update.latest}` : '');
  const install = document.getElementById('update-install');
  install.classList.toggle('hidden', update.state !== 'available' || update.asset !== 'Syntax.exe.zip' || !update.download);
  install.disabled = busy;
  document.getElementById('release-open').classList.toggle('hidden', !update.url || busy);
  document.querySelector('[data-action="updates"]').disabled = busy || update.state === 'checking';
}

async function saveModal() {
  if (!app.modal) return;
  const confirm = app.modal;
  const element = document.querySelector('[data-action="modal-save"]');
  if (!element || element.disabled) return;
  element.disabled = true;
  try {
    const result = await confirm();
    if (app.modal !== confirm) return;
    if (result?.ok) { closeModal(); await poll(true); }
    else if (result?.error) document.getElementById('modal-error').textContent = result.error;
  } catch { if (app.modal === confirm) draftError('Operation failed'); }
  finally { element.disabled = false; }
}

}

function draftContent() {
  return app.draft.mode === 'json' ? document.getElementById('preset-json').value : JSON.stringify(app.draft.rows);
}

function draftError(message = '') {
  const element = document.getElementById('modal-error');
  if (element) element.textContent = message;
}

function renderDraftEditor() {
  const draft = app.draft, editor = document.getElementById('preset-editor');
  if (!draft || !editor) return;
  if (draft.mode === 'rows' && draft.rows.length > DRAFT_ROW_LIMIT) {
    draft.mode = 'json';
    draft.json = JSON.stringify(draft.rows, null, 2);
  }
  document.querySelectorAll('[data-draft-mode]').forEach(button => button.classList.toggle('active', button.dataset.draftMode === draft.mode));
  if (draft.mode === 'json') {
    editor.innerHTML = `<textarea class="raweditor" id="preset-json" aria-label="Preset JSON" spellcheck="false">${esc(draft.json)}</textarea>`;
    return;
  }
  editor.innerHTML = `<div class="draft-add"><input class="input mono" id="draft-new-name" aria-label="New FFlag name" placeholder="FFlag name" maxlength="160"><input class="input mono" id="draft-new-value" aria-label="New FFlag value" placeholder="Value">${button('Add', 'draft-add', 'plus')}</div>
    <div class="draft-list">${draft.rows.map((row, index) => `<div class="draft-row ${warningClass(row)}" data-draft-row="${row.id}"><input class="input mono" data-draft-index="${index}" data-draft-field="name" aria-label="FFlag name ${index + 1}" value="${esc(row.name)}"><input class="input mono" data-draft-index="${index}" data-draft-field="value" aria-label="FFlag value ${index + 1}" value="${esc(row.value)}"><button class="iconbutton danger" data-draft-delete="${index}" aria-label="Delete FFlag ${index + 1}">${icon('trash')}</button></div>`).join('') || '<div class="empty"><h3>No FFlags</h3></div>'}</div><div class="draft-count">${draft.rows.length} FFlags</div>`;
}

async function validateDraft() {
  if (!app.draft) return;
  if (draftValidation) { draftValidationPending = true; return draftValidation; }
  const draft = app.draft, serial = ++draftSerial;
  draftValidation = (async () => {
    const result = await api('inspect_flags', draftContent());
    if (serial !== draftSerial || app.draft !== draft) return;
    if (!result.ok) return draftError(result.error);
    draftError();
    if (draft.mode === 'rows') {
      draft.rows = result.rows;
      const rows = new Map(result.rows.map(row => [row.id, row]));
      document.querySelectorAll('[data-draft-row]').forEach(element => {
        const row = rows.get(element.dataset.draftRow);
        element.className = 'draft-row ' + (row ? warningClass(row) : '');
      });
    }
  })();
  try { await draftValidation; }
  finally {
    draftValidation = null;
    if (draftValidationPending) {
      draftValidationPending = false;
      if (app.draft) { clearTimeout(draftTimer); draftTimer = setTimeout(validateDraft, 0); }
    }
  }
}

async function setDraftMode(mode) {
  if (!app.draft || app.draft.mode === mode) return;
  const draft = app.draft, serial = ++draftSerial;
  const content = draftContent();
  if (mode === 'rows') {
    const result = await api('inspect_flags', content);
    if (app.draft !== draft || serial !== draftSerial) return;
    if (!result.ok) return draftError(result.error);
    if (result.rows.length > DRAFT_ROW_LIMIT) return draftError(`Use JSON for more than ${DRAFT_ROW_LIMIT} FFlags`);
    app.draft.rows = result.rows;
  } else app.draft.json = JSON.stringify(app.draft.rows.map(row => ({ name: row.name, value: row.value, enabled: row.enabled })), null, 2);
  app.draft.mode = mode;
  draftSerial++;
  draftError();
  renderDraftEditor();
}

async function addDraftRow() {
  const draft = app.draft, serial = ++draftSerial;
  if (!draft || draft.mode !== 'rows') return;
  if (draft.rows.length >= DRAFT_ROW_LIMIT) return draftError(`Use JSON for more than ${DRAFT_ROW_LIMIT} FFlags`);
  const name = document.getElementById('draft-new-name').value;
  const value = document.getElementById('draft-new-value').value;
  const result = await api('inspect_flags', JSON.stringify([...app.draft.rows, { name, value }]));
  if (app.draft !== draft || serial !== draftSerial) return;
  if (!result.ok) return draftError(result.error);
  app.draft.rows = result.rows;
  draftSerial++;
  draftError();
  renderDraftEditor();
  document.getElementById('draft-new-name').focus();
}

async function debloatDraft() {
  const draft = app.draft, serial = ++draftSerial;
  if (!draft) return;
  const result = await api('debloat_draft', draftContent());
  if (app.draft !== draft || serial !== draftSerial) return;
  if (!result.ok) return draftError(result.error);
  app.draft.rows = result.rows;
  app.draft.json = JSON.stringify(result.rows.map(row => ({ name: row.name, value: row.value, enabled: row.enabled })), null, 2);
  draftSerial++;
  draftError();
  renderDraftEditor();
  toast(`Removed ${result.removed} FFlags`);
}

function newPresetModal() {
  app.draft = { rows: [], mode: 'rows', json: '{}' };
  showModal('New preset', `<div class="formfield"><label for="preset-name">Preset name</label><input class="input" id="preset-name" placeholder="Preset name" maxlength="60"></div><div class="draft-toolbar"><div class="actions"><button class="filter active" data-draft-mode="rows">FFlags</button><button class="filter" data-draft-mode="json">JSON</button></div>${button('Debloat', 'draft-debloat', 'bolt', 'small ghost')}</div><div id="preset-editor"></div>`, async () => {
    const result = await api('save_preset', document.getElementById('preset-name').value, draftContent());
    if (result.ok) { await refreshPresets(); toast('Preset saved'); }
    return result;
  }, 'Save preset', true);
  document.getElementById('modal').classList.add('preset-modal');
  renderDraftEditor();
}

async function poll(force = false) {
  if (app.polling) { await app.polling; if (force) return poll(); return; }
  if (!window.pywebview?.api) return;
  app.polling = (async () => {
    try {
      const data = await api('get_state', app.logId, app.revision, app.catalogRevision, app.status.revision ?? -1);
      if (!data?.ok) return;
      const changed = app.revision !== data.revision || app.catalogRevision !== data.catalog_revision;
      const checkStatus = Boolean(data.status && app.ready && app.page === 'flags' && app.filter !== 'all');
      const previousStatus = checkStatus ? JSON.stringify(app.status.flags) : '';
      if (app.catalogRevision !== data.catalog_revision && app.catalog.sourceRevision !== data.catalog_revision) {
        Object.assign(app.catalog, { items: [], loaded: false, loading: false, error: '', page: 0, more: false, count: 0 });
        app.catalog.serial++;
      }
      const presetsChanged = app.presetRevision !== data.preset_revision || app.libraryCatalogRevision !== data.catalog_revision;
      if (data.rows) { app.rows = data.rows; indexRows(); }
      if (data.status) app.status = data.status;
      Object.assign(app, { settings: data.settings, update: data.update, revision: data.revision, dump: data.dump || {}, configs: data.configs || {}, windowActive: data.window_active !== false });
      app.startupState = data.startup || { state: 'ready' };
      app.catalogRevision = data.catalog_revision;
      document.body.classList.toggle('no-motion', !app.settings.motion);
      updateEffects();
      if (data.logs?.length) {
        app.logs.push(...data.logs);
        app.logs = app.logs.slice(-400);
        app.logId = data.logs[data.logs.length - 1].id;
        renderLogs();
      }
      if (changed && app.page === 'flags') app.rowsPending = true;
      const editing = content.contains(document.activeElement) && document.activeElement.matches('input[data-value],select[data-value],select[data-type]');
      if (app.ready && app.rowsPending && app.page === 'flags' && !editing) { renderRows(); renderCatalog(); app.rowsPending = false; }
      else if (checkStatus && previousStatus !== JSON.stringify(app.status.flags) && !content.contains(document.activeElement)) renderRows();
      if (app.ready && presetsChanged && ['presets', 'scc'].includes(app.page)) await refreshPresets();
      if (app.ready && presetsChanged && app.page === 'community') await refreshCommunity();
      updateStatus();
      updateJobs();
      updateStartup();
      if (app.ready && app.page === 'flags' && app.loaded && !app.catalog.loaded && !app.catalog.loading && !app.catalog.error) fetchCatalog();
    } finally { app.polling = null; }
  })();
  return app.polling;
}

async function init() {
  if (app.loaded) return;
  app.loaded = true;
  await poll();
  schedulePoll();
}

function updateEffects() {
  document.body.classList.toggle('no-motion', !app.settings.motion);
  if (app.settings.theme && app.settings.theme !== 'purple') document.body.dataset.theme = app.settings.theme;
  else delete document.body.dataset.theme;
  const theme = themeNames.includes(app.settings.theme) ? app.settings.theme : 'purple';
  const logo = window.syntaxLogos[theme];
  if (logo) {
    document.querySelectorAll('.titlelogo, .brand img, .about img, .startup-logo').forEach(image => {
      if (image.src !== logo) image.src = logo;
      image.dataset.logoTheme = theme;
    });
    const favicon = document.querySelector('link[rel="icon"]');
    if (favicon && favicon.href !== logo) favicon.href = logo;
  }
  window.snowfall?.setEnabled(app.ready && app.settings.snow && app.settings.motion && app.windowActive && !document.hidden && document.hasFocus());
}

function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try { await poll(); } finally { schedulePoll(); }
  }, !app.ready ? document.hidden || !app.windowActive ? 1000 : 300 : document.hidden || !app.windowActive ? 4000 : 1000);
}

window.syntaxWindowActive = active => { app.windowActive = !!active; updateEffects(); if (active) poll(); };
window.addEventListener('focus', updateEffects);
window.addEventListener('blur', updateEffects);
document.addEventListener('visibilitychange', updateEffects);

function savePreferences(patch) {
  pendingPreferences = { ...pendingPreferences, ...patch };
  const operation = preferenceQueue.then(async () => {
    const next = { ...app.settings, ...patch };
    const result = await act('save_preferences', [next.rpc, next.motion, next.snow, next.theme, next.tray, next.startup, next.LockF !== false]);
    if (result.ok) { app.settings = next; updateEffects(); }
    for (const [key, value] of Object.entries(patch)) {
      if (pendingPreferences[key] === value) delete pendingPreferences[key];
    }
    return result;
  });
  preferenceQueue = operation.catch(() => {});
  return operation;
}

const actions = {
  'startup-continue': () => act('complete_startup'),
  'startup-update': () => act('install_update'),
  'startup-check': () => act('check_updates'),
  'startup-retry': async () => { await poll(true); updateStartup(); },
  apply: () => act('apply_flags', [], 'Apply queued'),
  minimize: () => api('minimize_window'), close: () => api('close_window'), discord: () => api('open_discord'),
  import: () => act('load_flags', [], 'JSON imported'), export: () => act('export_flags', [], 'JSON exported'),
  add: addModal, raw: rawModal, 'modal-close': closeModal, 'modal-save': saveModal,
  'new-preset': newPresetModal, 'draft-add': addDraftRow, 'draft-debloat': debloatDraft,
  debloat: async () => { const result = await act('debloat_flags'); if (result.ok) toast(`Removed ${result.removed} FFlags`); },
  'debloat-presets': async () => { const result = await act('debloat_presets'); if (result.ok) { await refreshPresets(); toast(`Removed ${result.removed} FFlags`); } },
  clear: () => showModal('Clear all FFlags?', `<span class="muted">${app.rows.length} FFlags</span>`, () => api('clear_flags'), 'Clear', false, true),
  more: () => { app.limit += 100; renderRows(); },
  'catalog-refresh': () => fetchCatalog(true), 'catalog-more': () => fetchCatalog(false, true),
  'catalog-source': () => api('open_catalog_source'),
  prefixes: async () => { const result = await act('add_prefixes'); if (result.ok) toast(`${result.changed} prefixes added · ${result.unresolved} need a type`); },
  'configs-refresh': () => act('refresh_configs'),
  'dump-offsets': () => act('dump_offsets'), 'dump-cancel': () => act('cancel_dump'),
  updates: () => act('check_updates'), release: () => act('open_release'),
  'update-install': () => act('install_update'),
  sync: async () => { const result = await act('sync_offsets'); if (result.ok) { toast('Offsets refreshed'); fetchCatalog(); } },
  validate: async () => { const result = await act('validate_flags'); if (result.ok) toast(result.missing.length ? `${result.missing.length} unavailable FFlags` : 'FFlags checked', !!result.missing.length); },
  'clear-logs': () => { app.logs = []; renderLogs(); },
  'copy-logs': async () => {
    try { await navigator.clipboard.writeText(app.logs.map(entry => entry.time + ' ' + entry.text).join('\n')); toast('Console copied'); }
    catch { toast('Clipboard unavailable', true); }
  },
};

document.addEventListener('click', async event => {
  const element = event.target.closest('button');
  if (!element || element.disabled) return;
  if (!app.ready && !['minimize', 'close', 'startup-continue', 'startup-update', 'startup-check', 'startup-retry'].includes(element.dataset.action)) return;
  if (element.dataset.page) return switchPage(element.dataset.page);
  if (element.dataset.draftMode) return setDraftMode(element.dataset.draftMode);
  if (element.dataset.draftDelete !== undefined) {
    app.draft.rows.splice(Number(element.dataset.draftDelete), 1);
    draftSerial++;
    renderDraftEditor();
    return validateDraft();
  }
  if (element.dataset.presetDebloat) {
    const result = await act('debloat_presets', [element.dataset.presetDebloat]);
    if (result.ok) { await refreshPresets(); toast(`Removed ${result.removed} FFlags`); }
    return;
  }
  if (element.dataset.action) {
    const action = actions[element.dataset.action];
    if (!action) return;
    if (['modal-save', 'modal-close'].includes(element.dataset.action)) return action();
    element.disabled = true;
    try { await action(); } finally { element.disabled = false; }
    return;
  }
  if (element.dataset.filter) {
    app.filter = element.dataset.filter;
    app.limit = 100;
    document.querySelectorAll('[data-filter]').forEach(filter => filter.classList.toggle('active', filter === element));
    return renderRows();
  }
  if (element.dataset.community) {
    element.disabled = true;
    try { return await act('apply_community', [element.dataset.community], 'Community pack applied'); }
    finally { element.disabled = false; }
  }
  if (element.dataset.toggle) {
    element.disabled = true;
    try { return await act('toggle_flag', [element.dataset.toggle, element.getAttribute('aria-checked') !== 'true']); }
    finally { element.disabled = false; }
  }
  if (element.dataset.delete) return act('delete_flag', [element.dataset.delete]);
  if (element.dataset.preference) {
    const key = element.dataset.preference;
    const next = !(pendingPreferences[key] ?? app.settings[key]);
    element.disabled = true;
    try {
      const result = await savePreferences({ [key]: next });
      if (result.ok) element.setAttribute('aria-checked', String(next));
    } finally { element.disabled = false; }
    return;
  }
  if (element.dataset.catalogAdd) {
    element.disabled = true;
    const result = await act('add_catalog_flag', [element.dataset.catalogAdd]);
    if (result.ok) {
      app.query = ''; app.filter = 'all';
      document.getElementById('flag-search').value = '';
      renderRows(); renderCatalog();
      const pending = app.rows.find(row => row.needs_type && row.name === element.dataset.catalogAdd);
      if (pending) [...document.querySelectorAll('[data-type]')].find(select => select.dataset.type === pending.id)?.focus();
    } else element.disabled = false;
    return;
  }
  const identifier = element.dataset.apply || element.dataset.quick;
  if (identifier) {
    const overrides = {};
    element.closest('[data-preset]')?.querySelectorAll('[data-control]').forEach(input => { overrides[input.dataset.control] = input.value; });
    element.disabled = true;
    try { await act('apply_preset', [identifier, overrides], 'Preset applied'); }
    finally { element.disabled = false; }
  }
});

document.addEventListener('change', async event => {
  const element = event.target;
  if (element.id === 'theme-select') {
    element.disabled = true;
    try {
      const result = await savePreferences({ theme: element.value });
      if (!result.ok) element.value = app.settings.theme;
    } finally { element.disabled = false; }
    return;
  }
  if (element.id === 'offset-source') {
    const result = await act('select_offset_source', [element.value]);
    if (!result.ok) element.value = app.settings.offset_source;
    return;
  }
  if (element.dataset.value) {
    element.disabled = true;
    try {
      const result = await act('edit_flag', [element.dataset.value, element.value]);
      if (!result.ok) element.value = app.rows.find(row => row.id === element.dataset.value)?.value || '';
      element.classList.remove('dirty');
    } finally { element.disabled = false; }
  }
  if (element.dataset.type) {
    element.disabled = true;
    try { const result = await act('set_flag_type', [element.dataset.type, element.value]); if (!result.ok) renderRows(); }
    finally { element.disabled = false; }
  }
  if (element.id === 'quick-resolution' && element.value) await act('add_flag', ['DFIntDebugDynamicRenderKiloPixels', element.value], 'Resolution saved');
});

document.addEventListener('input', event => {
  const element = event.target;
  if (element.id === 'flag-search') { app.query = element.value; app.limit = 100; clearTimeout(flagSearchTimer); flagSearchTimer = setTimeout(renderRows, 100); }
  if (element.matches('input[data-value]')) element.classList.add('dirty');
  if (element.dataset.draftField) {
    draftSerial++;
    app.draft.rows[Number(element.dataset.draftIndex)][element.dataset.draftField] = element.value;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(validateDraft, 170);
  }
  if (element.id === 'preset-json') {
    draftSerial++;
    app.draft.json = element.value;
    clearTimeout(draftTimer);
    draftTimer = setTimeout(validateDraft, 170);
  }
  if (element.id === 'catalog-search') {
    app.catalog.query = element.value;
    app.catalog.serial++;
    clearTimeout(catalogTimer);
    catalogTimer = setTimeout(() => fetchCatalog(), 160);
  }
});

document.addEventListener('keydown', event => {
  if (!app.ready) {
    if ((event.ctrlKey || event.metaKey) && ['o', 'k'].includes(event.key.toLowerCase())) event.preventDefault();
    return;
  }
  if (app.modal) {
    if (event.key === 'Escape') { event.preventDefault(); closeModal(); }
    if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
      event.preventDefault();
      if (['draft-new-name', 'draft-new-value'].includes(event.target.id)) addDraftRow();
      else if (!event.target.dataset.draftField) saveModal();
    }
    if (event.key === 'Tab') {
      const elements = [...document.getElementById('modal').querySelectorAll('button,input,textarea,select')].filter(element => !element.disabled);
      const first = elements[0], last = elements[elements.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
    return;
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
    event.preventDefault();
    if (app.page !== 'flags') switchPage('flags');
    document.getElementById('flag-search')?.focus();
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'o') { event.preventDefault(); actions.import(); }
  if (event.key === 'Enter' && event.target.matches('input[data-value]')) event.target.blur();
});

document.getElementById('modal-back').addEventListener('click', event => { if (event.target.id === 'modal-back') closeModal(); });
icons();
render();
window.addEventListener('pywebviewready', init);
startupTimer = setTimeout(() => { if (!app.ready) { app.startupDelayed = true; updateStartup(); } }, 20000);
init();

</script>
</body>
</html>
