name: Build
on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Verify source
        run: python syntax.py --check
      - name: Test
        run: python syntax.py --test
  build:
    name: Build Syntax.exe
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os,syntax; assert syntax.version_key(os.environ['GITHUB_REF_NAME']) == syntax.version_key(syntax.VERSION), 'Release version mismatch'"
      - name: Verify source
        run: python syntax.py --check
      - name: Build Syntax.exe
        run: python syntax.py --build
      - name: Verify executable name
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "Syntax.exe" -PathType Leaf)) { throw "Syntax.exe missing" }
          if ((Get-Item -LiteralPath "Syntax.exe").Name -cne "Syntax.exe") { throw "Incorrect filename case" }
      - name: Verify executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path -LiteralPath "Syntax.exe").Path -ArgumentList "--check" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable verification failed: $($process.ExitCode)" }
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Syntax.exe
          path: Syntax.exe
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Syntax.exe
          fail_on_unmatched_files: true
          make_latest: true
